author      = "Chris Palmer"
base_url    = "https://red-oxide.org"
description = "Open-source projects by Chris Palmer: NixOS, desktop, feeds and tooling."
title       = "red-oxide"

theme = "rivet"

default_language = "en"

build_search_index = false
compile_sass       = true
minify_html        = true

feed_filenames = ["atom.xml"]
generate_feeds = true

taxonomies = [{ name = "tags", feed = true }]

[extra]

# The Zola to build with, everywhere: set ZOLA_VERSION in Cloudflare Pages to
# this too. CI fails when nixpkgs' Zola differs (.github/workflows/build.yml).
zola_version = "0.23.6"

# rivet's settings (themes/rivet/README.md)
[extra.rivet]
footer_links = [{ name = "MIT / CC BY 4.0", path = "license/" }]
hero_image   = { src = "logo.svg", size = 128, shape = "square" }
logo         = "logo.svg"
nav          = [{ name = "projects", path = "projects/" }, { name = "news", path = "news/" }, { name = "about", path = "about/" }]
og_image     = { path = "logo-512.png", width = 512, height = 512 }
recent       = { section = "news/_index.md", count = 5, heading = "Latest news", empty = "No news yet." }

[markdown]
github_alerts = true
